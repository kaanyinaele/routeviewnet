name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The desktop window is cgo against GTK3 + WebKitGTK, so the headers
      # have to be present for `go build ./...` to cover cmd/routeviewnet-gui.
      - name: Install GTK/WebKit headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d ./cmd ./internal
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

  web:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build

  packaging:
    name: Packaging scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # maintainer scripts run under dash on Debian/Ubuntu, not bash
      - name: Check maintainer scripts parse under dash
        run: |
          for f in install.sh packaging/scripts/install.sh \
                   packaging/debian/postinst packaging/debian/prerm packaging/debian/postrm; do
            echo "checking $f"
            dash -n "$f"
            test -x "$f" || { echo "$f is not executable"; exit 1; }
          done

      - name: Check the systemd unit parses
        run: systemd-analyze verify packaging/systemd/routeviewnetd.service || true
